[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[build.environment]
  NODE_VERSION = "22"

# The Offer Fix was renamed to the Offer Blender
[[redirects]]
  from = "/offer-fix/*"
  to = "/offer-blender/"
  status = 301
  force = true
